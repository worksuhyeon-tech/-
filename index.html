<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim 조치대상 관리</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #182033;
      --muted: #6b7485;
      --line: #e7edf5;
      --blue: #2563eb;
      --blue-strong: #1d4ed8;
      --blue-soft: #eff6ff;
      --red: #ef4444;
      --red-soft: #fff1f2;
      --amber: #f59e0b;
      --amber-soft: #fffbeb;
      --green: #10b981;
      --green-soft: #ecfdf5;
      --shadow: 0 18px 45px rgba(28, 44, 70, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 1180px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      letter-spacing: -0.02em;
    }

    button, textarea { font: inherit; }

    .app {
      width: min(1560px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 32px 0 36px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 22px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-strong);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
    }

    .header-chip {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 14px;
      color: #3b4658;
      font-size: 14px;
      box-shadow: 0 8px 20px rgba(28, 44, 70, 0.05);
      white-space: nowrap;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 12px;
    }

    .summary-card {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border: 1px solid rgba(231, 237, 245, 0.9);
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: var(--shadow);
    }

    .summary-card::after {
      content: "";
      position: absolute;
      right: -28px;
      top: -36px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.08);
    }

    .summary-card strong {
      display: block;
      font-size: 34px;
      line-height: 1;
      color: var(--text);
      margin: 10px 0 9px;
    }

    .summary-card .label {
      color: #364256;
      font-weight: 800;
      font-size: 15px;
    }

    .summary-card .help {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .personal-metrics {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin: 4px 0 22px 4px;
      cursor: help;
    }

    .metric-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 4px var(--blue-soft);
    }

    .workspace {
      display: grid;
      grid-template-columns: 230px minmax(610px, 1fr) 370px;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(231, 237, 245, 0.96);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .side-panel { padding: 18px; }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 15px;
      font-weight: 900;
    }

    .side-desc {
      margin: -7px 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .tab-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .type-tab {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: #3b4658;
      border-radius: 15px;
      padding: 13px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      transition: 0.18s ease;
    }

    .type-tab:hover { background: #f8fbff; border-color: var(--line); }

    .type-tab.active {
      background: var(--blue-soft);
      border-color: rgba(37, 99, 235, 0.18);
      color: var(--blue-strong);
      font-weight: 900;
      box-shadow: inset 4px 0 0 var(--blue);
    }

    .count-pill {
      min-width: 30px;
      text-align: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #526071;
      font-size: 12px;
      font-weight: 900;
    }

    .type-tab.active .count-pill { background: #dbeafe; color: var(--blue-strong); }

    .list-panel { padding: 18px; }

    .list-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    .list-title-wrap h2 {
      margin: 0 0 5px;
      font-size: 18px;
      letter-spacing: -0.04em;
    }

    .list-title-wrap p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .today-alert {
      border: 1px solid #bfdbfe;
      background: linear-gradient(135deg, #eff6ff, #ffffff);
      color: var(--blue-strong);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .table-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: var(--card);
    }

    .table-head, .claim-row {
      display: grid;
      grid-template-columns: 72px 130px 82px 96px 92px 92px 78px 82px;
      gap: 8px;
      align-items: center;
    }

    .table-head {
      padding: 12px 14px;
      background: #f8fafc;
      color: #7b8494;
      font-size: 12px;
      font-weight: 900;
      border-bottom: 1px solid var(--line);
    }

    .claim-row {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      padding: 14px;
      color: #30394a;
      text-align: left;
      cursor: pointer;
      transition: 0.16s ease;
    }

    .claim-row:last-child { border-bottom: 0; }
    .claim-row:hover { background: #fbfdff; }

    .claim-row.selected {
      background: #f4f8ff;
      box-shadow: inset 4px 0 0 var(--blue);
    }

    .cell-main { font-weight: 900; color: #202a3c; }
    .cell-small { color: var(--muted); font-size: 13px; }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-width: 48px;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .urgency-high { background: var(--red-soft); color: #dc2626; border-color: #fecdd3; }
    .urgency-mid { background: var(--amber-soft); color: #b45309; border-color: #fde68a; }
    .urgency-low { background: var(--green-soft); color: #047857; border-color: #bbf7d0; }
    .status-wait { background: #f1f5f9; color: #475569; }
    .status-progress { background: #eff6ff; color: var(--blue-strong); }
    .status-done { background: var(--green-soft); color: #047857; }
    .status-hold { background: #f8fafc; color: #64748b; border-color: #cbd5e1; }

    .detail-panel {
      padding: 18px;
      position: sticky;
      top: 18px;
    }

    .selected-id {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }

    .selected-id h2 {
      margin: 6px 0 6px;
      font-size: 20px;
      letter-spacing: -0.04em;
    }

    .selected-id p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .insight-box {
      margin: 16px 0;
      padding: 15px;
      border-radius: 18px;
      background: linear-gradient(135deg, #eff6ff 0%, #ffffff 80%);
      border: 1px solid #dbeafe;
    }

    .insight-box .label {
      display: block;
      color: var(--blue-strong);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .insight-box p {
      margin: 0;
      line-height: 1.48;
      font-size: 14px;
      font-weight: 800;
      color: #253149;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 16px;
    }

    .info-item {
      padding: 12px;
      border-radius: 15px;
      background: #f8fafc;
      border: 1px solid #eef2f7;
      min-height: 62px;
    }

    .info-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .info-item strong {
      display: block;
      color: #263044;
      font-size: 13px;
      line-height: 1.35;
    }

    .subsection-title {
      margin: 18px 0 10px;
      font-size: 14px;
      font-weight: 900;
      color: #30394a;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .action-btn, .complete-btn {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 10px;
      background: #fff;
      color: #344055;
      font-weight: 900;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .action-btn:hover { transform: translateY(-1px); border-color: #bfdbfe; color: var(--blue-strong); }
    .action-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .action-btn.primary:hover, .complete-btn:hover { background: var(--blue-strong); color: #fff; }
    .action-btn.danger { color: #dc2626; border-color: #fecdd3; background: #fffafa; }
    .action-btn.warning { color: #b45309; border-color: #fde68a; background: #fffdf5; }

    textarea {
      width: 100%;
      height: 86px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px;
      outline: none;
      color: #263044;
      background: #fbfdff;
      line-height: 1.45;
    }

    textarea:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 4px #dbeafe;
      background: #fff;
    }

    .complete-btn {
      width: 100%;
      margin-top: 10px;
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      padding: 14px;
      font-size: 15px;
    }

    .toast {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 10;
      min-width: 280px;
      padding: 15px 18px;
      border-radius: 18px;
      background: #111827;
      color: #fff;
      box-shadow: 0 18px 50px rgba(17, 24, 39, 0.22);
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: 0.22s ease;
      font-weight: 800;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-state {
      padding: 42px 16px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 1280px) {
      body { min-width: 1100px; }
      .app { width: calc(100vw - 28px); }
      .workspace { grid-template-columns: 210px minmax(560px, 1fr) 340px; gap: 14px; }
      .table-head, .claim-row { grid-template-columns: 66px 124px 76px 86px 84px 84px 70px 74px; font-size: 13px; }
      .summary-card { padding: 18px 15px; }
    }
  </style>
</head>

    let selectedType = actionTypes[0].name;
    let selectedAccidentNo = claims.find((claim) => claim.actionType === selectedType).accidentNo;
    let toastTimer;

    const $ = (selector) => document.querySelector(selector);

    function urgencyClass(urgency) {
      if (urgency === "긴급") return "urgency-high";
      if (urgency === "주의") return "urgency-mid";
      return "urgency-low";
    }

    function statusClass(status) {
      if (status === "완료") return "status-done";
      if (status === "처리중") return "status-progress";
      if (status === "보류") return "status-hold";
      return "status-wait";
    }

    function getFilteredClaims() {
      return claims.filter((claim) => claim.actionType === selectedType);
    }

    function getSelectedClaim() {
      return claims.find((claim) => claim.accidentNo === selectedAccidentNo) || getFilteredClaims()[0];
    }

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function renderSummary() {
      $("#summaryGrid").innerHTML = summaryCards.map((card) => `
        <article class="summary-card">
          <span class="label">${card.label}</span>
          <strong>${card.value}</strong>
          <span class="help">${card.help}</span>
        </article>
      `).join("");
    }

    function renderTabs() {
      $("#totalActionCount").textContent = actionTypes.reduce((sum, item) => sum + item.count, 0);
      $("#tabList").innerHTML = actionTypes.map((type) => `
        <button class="type-tab ${type.name === selectedType ? "active" : ""}" type="button" data-type="${type.name}">
          <span>${type.name}</span>
          <span class="count-pill">${type.count}</span>
        </button>
      `).join("");

      document.querySelectorAll(".type-tab").forEach((button) => {
        button.addEventListener("click", () => {
          selectedType = button.dataset.type;
          selectedAccidentNo = getFilteredClaims()[0]?.accidentNo;
          renderAll();
        });
      });
    }

    function renderRows() {
      const filteredClaims = getFilteredClaims();
      $("#listTitle").textContent = `${selectedType} 조치대상`;
      $("#todayAlert").textContent = `오늘 우선 처리 ${filteredClaims.length}건`;

      if (!filteredClaims.length) {
        $("#claimRows").innerHTML = `<div class="empty-state">선택한 유형의 조치대상이 없습니다.</div>`;
        return;
      }

      $("#claimRows").innerHTML = filteredClaims.map((claim) => `
        <button class="claim-row ${claim.accidentNo === selectedAccidentNo ? "selected" : ""}" type="button" data-accident-no="${claim.accidentNo}">
          <span><span class="badge ${urgencyClass(claim.urgency)}">${claim.urgency}</span></span>
          <span class="cell-main">${claim.accidentNo}</span>
          <span>${claim.customerName}</span>
          <span>${claim.carNo}</span>
          <span class="cell-small">${claim.currentStatus}</span>
          <span class="cell-small">${claim.elapsed}</span>
          <span>${claim.owner}</span>
          <span><span class="badge ${statusClass(claim.processStatus)}">${claim.processStatus}</span></span>
        </button>
      `).join("");

      document.querySelectorAll(".claim-row").forEach((row) => {
        row.addEventListener("click", () => {
          selectedAccidentNo = row.dataset.accidentNo;
          renderRows();
          renderDetail();
        });
      });
    }

    function renderDetail() {
      const claim = getSelectedClaim();
      if (!claim) return;

      const config = actionConfig[claim.actionType];
      const commonItems = [
        ["고객명", claim.customerName],
        ["차량번호", claim.carNo],
        ["고객구분", claim.customerType],
        ["현재상태", claim.currentStatus],
        ["조치유형", claim.actionType],
        ["경과시간", claim.elapsed],
        ["담당자", claim.owner],
        ["처리상태", claim.processStatus]
      ];
      const extraItems = config.fields.map((field) => [field, claim[field] || "-"]);

      $("#detailPanel").innerHTML = `
        <div class="selected-id">
          <div>
            <span class="badge ${urgencyClass(claim.urgency)}">${claim.urgency}</span>
            <h2>${claim.accidentNo}</h2>
            <p>${claim.customerName} · ${claim.carNo}</p>
          </div>
          <span class="badge ${statusClass(claim.processStatus)}">${claim.processStatus}</span>
        </div>

        <div class="insight-box">
          <span class="label">조치 필요 내용</span>
          <p>${claim.actionContent}</p>
        </div>

        <div class="subsection-title">선택 건 요약</div>
        <div class="info-grid">
          ${commonItems.map(([label, value]) => `<div class="info-item"><span>${label}</span><strong>${value}</strong></div>`).join("")}
        </div>

        <div class="subsection-title">${claim.actionType} 추가 정보</div>
        <div class="info-grid">
          ${extraItems.map(([label, value]) => `<div class="info-item"><span>${label}</span><strong>${value}</strong></div>`).join("")}
        </div>

        <div class="subsection-title">빠른 액션</div>
        <div class="action-grid">
          ${config.buttons.map((label, index) => `<button class="action-btn ${buttonTone(label, index)}" type="button" data-action="${label}">${label}</button>`).join("")}
        </div>

        <div class="subsection-title">처리 메모</div>
        <textarea placeholder="고객/업체 통화 결과, 보류 사유, 다음 조치 예정 시간을 남겨주세요."></textarea>
        <button class="complete-btn" type="button" data-action="처리완료">처리완료</button>
      `;

      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => handleAction(button.dataset.action));
      });
    }

    function buttonTone(label, index) {
      if (label.includes("관리자") || label.includes("보류")) return label.includes("보류") ? "warning" : "danger";
      if (label.includes("전화") || label.includes("재발송") || label.includes("재요청") || index === 0) return "primary";
      return "";
    }

    function handleAction(actionName) {
      const claim = getSelectedClaim();
      if (!claim) return;

      if (actionName === "처리완료") {
        claim.processStatus = "완료";
        showToast(`${claim.accidentNo} 처리상태가 완료로 변경되었습니다.`);
        renderRows();
        renderDetail();
        return;
      }

      if (actionName === "보류 처리") {
        claim.processStatus = "보류";
        showToast(`${claim.accidentNo} 보류 처리가 완료되었습니다.`);
        renderRows();
        renderDetail();
        return;
      }

      const suffix = actionName.endsWith("요청") || actionName.endsWith("등록") || actionName.endsWith("처리")
        ? "이 완료되었습니다."
        : "가 완료되었습니다.";
      showToast(`${actionName}${suffix}`);
    }

    function renderAll() {
      renderSummary();
      renderTabs();
      renderRows();
      renderDetail();
    }

    renderAll();
  </script>
